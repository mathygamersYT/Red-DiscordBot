name: Docker Multi-Arch Build

on:
  push:
    branches: [ "V3/develop" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mathygamersyt/red-discordbot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ESTO ES LO QUE FALTA: Instala emuladores para que GitHub entienda ARM
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ESTO ES LO QUE FALTA: Configura el constructor avanzado
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # AQUÍ ESTÁ LA MAGIA: Obliga a crear ambas versiones
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Optimiza la subida
          cache-from: type=gha
          cache-to: type=gha,mode=max
